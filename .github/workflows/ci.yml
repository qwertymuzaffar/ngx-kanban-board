name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx ng build ngx-kanban-board
      - run: npx ng test ngx-kanban-board --no-watch --coverage
      - run: npx ng run demo:build-storybook
        env:
          CI: "true"
